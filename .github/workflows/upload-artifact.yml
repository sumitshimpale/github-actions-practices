name: upload artifact

on:
  worklflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      
      - name: create report
        run: |
          echo "Pipeline Successful" > report.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4

        with:
          name: build-report
          path: report.txt